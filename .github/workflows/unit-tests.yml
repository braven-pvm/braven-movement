name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Pillow is here so the sync sheet's drawing is REACHABLE on the runner.
      # Its rules import without Pillow by design, so leaving it out would let
      # those tests run and quietly leave the drawing untested, which is the
      # regression class this workflow exists to catch.
      #
      # OpenCV is here for the same reason and it is the same precedent.
      # test_video_calibration.py is the whole guard on the calibration
      # ingestion: 43 tests, every sign convention held by a mutation, and not
      # one of them needs a solver or a frame of footage. Without OpenCV on the
      # runner that file cannot even import, so the hosted verdict would be
      # green while nothing about the calibration had been checked. Headless
      # because a runner has no display and the GUI build pulls in libGL.
      #
      # SciPy is here on the same precedent a third time.
      # test_video_phase_align.py holds the alignment's guards, including the
      # refusal path that session 1.0's own footage never reaches, and
      # `find_peaks` is the one thing in that module a runner cannot supply for
      # itself.
      - name: Install what the engine-side tests read
        run: python -m pip install --quiet numpy pillow opencv-python-headless scipy
      # TEMPORARY (2026-09-11, the painted-kit lane). #117 went red on this
      # runner with OSError: cannot open resource, from a hard-coded
      # C:/Windows/Fonts path. This prints what this machine HAS, so the
      # replacement default is measured here rather than guessed there.
      # Remove it once that is read.
      - name: What fonts does this runner have
        run: |
          python - <<'PROBE'
          import sys, PIL
          from pathlib import Path
          from PIL import ImageFont
          print('[font-probe] python', sys.version.split()[0], sys.platform)
          print('[font-probe] Pillow', PIL.__version__)
          for root in (Path('/usr/share/fonts'), Path('/usr/local/share/fonts')):
              if not root.is_dir():
                  print('[font-probe]', root, ': absent'); continue
              found = sorted(q for q in root.rglob('*')
                             if q.suffix.lower() in ('.ttf', '.otf', '.ttc'))
              print('[font-probe]', root, ':', len(found), 'files')
              for q in found[:40]:
                  print('[font-probe]    ', q)
          for call, label in ((lambda: ImageFont.load_default(size=40),
                               'load_default(size=40)'),
                              (ImageFont.load_default, 'load_default()')):
              try:
                  font = call()
                  name = font.getname() if hasattr(font, 'getname') else '?'
                  print('[font-probe]', label, '->', type(font).__name__, name)
              except Exception as error:
                  print('[font-probe]', label, 'FAILED:',
                        type(error).__name__, error)
          PROBE
      - name: Run host-side contracts
        run: python -m unittest discover -s tests -v
      # The engine-side suite, which used to run only on a machine with the
      # pixi environment on it. Most of it is arithmetic on joint positions and
      # needs no solver, so the only thing that kept it off a runner was a
      # handful of module-level imports of pymomentum, which is conda-forge
      # only. Anything that genuinely needs the solver skips itself.
      #
      # This is the half of the clip guard that a runner can hold. The other
      # half cannot: refer to "The pre-merge gate" in
      # docs/TACTICS_CLIP_CONTRACT.md.
      - name: Run engine-side contracts
        working-directory: spikes
        run: python -m unittest discover -s . -p "test_*.py" -v
