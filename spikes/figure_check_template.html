<title>Figure Check</title>
<style>
  :root {
    --page: #eceae6; --sheet: #ffffff; --ink: #17150f; --soft: #6b665c;
    --line: #d8d2c6; --ball: #c25f22; --figure: #cfc7b8; --focus: #2c6fb8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #121110; --sheet: #1b1a17; --ink: #ece8de; --soft: #948d80;
      --line: #33302a; --ball: #d97b3c; --figure: #cfc7b8; --focus: #6aa9e8;
    }
  }
  :root[data-theme="dark"] {
    --page: #121110; --sheet: #1b1a17; --ink: #ece8de; --soft: #948d80;
    --line: #33302a; --ball: #d97b3c; --figure: #cfc7b8; --focus: #6aa9e8;
  }
  html, body { height: 100%; }
  body {
    background: var(--page); color: var(--ink); margin: 0;
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* The figure fills the window. The point of this page is to see her large. */
  .wrap {
    height: 100dvh; box-sizing: border-box; padding: 10px 14px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: -0.01em;
       white-space: nowrap; }
  .stage {
    flex: 1; min-height: 0;
    background: var(--sheet); border: 1px solid var(--line); border-radius: 4px;
    cursor: grab; touch-action: none; overflow: hidden;
  }
  .stage:active { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  .label { font: 600 10.5px/1 ui-monospace, Consolas, monospace;
           text-transform: uppercase; letter-spacing: 0.13em; color: var(--soft); }
  button {
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 10px; cursor: pointer;
    font: 500 11px/1 ui-monospace, Consolas, monospace;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--sheet);
                                border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .readout { font: 11.5px/1.4 ui-monospace, Consolas, monospace; color: var(--soft);
             font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <div class="bar">
    <h1 id="heading">Figure check</h1>
    <span class="label">Phase</span><span id="phases"></span>
    <span class="label" style="margin-left:10px">View</span>
    <button type="button" data-view="front">Front</button>
    <button type="button" data-view="quarter">Three quarter</button>
    <button type="button" data-view="side">Side</button>
    <button type="button" data-view="back">Back</button>
    <button type="button" id="wire" aria-pressed="false">Edges</button>
  </div>
  <div class="stage"><canvas id="view" width="1100" height="1300"></canvas></div>
  <div class="readout" id="readout"></div>
</div>

<script>
const DATA = __DATA__;
const FACES = DATA.faces;
const SCALE = DATA.vertexScale || 1;
const W = 1100, H = 1300, PAD = 24;
document.getElementById('heading').textContent = DATA.heading;

let phase = DATA.figures.length > 2 ? 2 : 0;
let edges = false;
const HOME = { az: 0.0, el: -0.05, zoom: 1, panX: 0, panY: 0 };
let cam = Object.assign({}, HOME);

const box = (() => {
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (const f of DATA.figures)
    for (let i = 0; i < f.v.length; i += 3)
      for (let a = 0; a < 3; a++) {
        lo[a] = Math.min(lo[a], f.v[i + a] / SCALE);
        hi[a] = Math.max(hi[a], f.v[i + a] / SCALE);
      }
  return { lo, hi };
})();
const centre = [0, 1, 2].map(a => (box.lo[a] + box.hi[a]) / 2);
const span = Math.max(box.hi[1] - box.lo[1], 1);

// Up, to the left, and toward the viewer. Screen y points down and depth grows
// toward the camera, so up is negative and near is positive.
const LIGHT = [-0.40, -0.55, 0.73];

function draw() {
  const f = DATA.figures[phase];
  const canvas = document.getElementById('view');
  const g = canvas.getContext('2d');
  const style = getComputedStyle(document.body);
  const sheet = style.getPropertyValue('--sheet').trim();
  const ink = style.getPropertyValue('--figure').trim();
  const ballColour = style.getPropertyValue('--ball').trim();
  g.fillStyle = sheet; g.fillRect(0, 0, W, H);

  const k = (H - 2 * PAD) / (span * 1.05) * cam.zoom;
  const ca = Math.cos(cam.az), sa = Math.sin(cam.az);
  const ce = Math.cos(cam.el), se = Math.sin(cam.el);
  const project = (x, y, z) => {
    const dx = x - centre[0], dy = y - centre[1], dz = z - centre[2];
    const px = dx * ca + dz * sa;
    const zr = dz * ca - dx * sa;
    return [
      W / 2 + px * k + cam.panX,
      H - PAD - (dy * ce - zr * se + span / 2) * k + cam.panY,
      (dy * se + zr * ce) * k,
    ];
  };

  const points = [];
  for (let i = 0; i < f.v.length; i += 3)
    points.push(project(f.v[i] / SCALE, f.v[i + 1] / SCALE, f.v[i + 2] / SCALE));

  const normals = new Float64Array(points.length * 3);
  const faceZ = new Float64Array(FACES.length / 3);
  for (let i = 0, t = 0; i < FACES.length; i += 3, t++) {
    const a = points[FACES[i]], b = points[FACES[i + 1]], c = points[FACES[i + 2]];
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    faceZ[t] = nz;
    for (const v of [FACES[i], FACES[i + 1], FACES[i + 2]]) {
      normals[v * 3] += nx; normals[v * 3 + 1] += ny; normals[v * 3 + 2] += nz;
    }
  }

  const [r, gg, bb] = [1, 3, 5].map(i => parseInt(ink.slice(i, i + 2), 16));
  const tris = [];
  for (let i = 0, t = 0; i < FACES.length; i += 3, t++) {
    if (faceZ[t] < 0) continue;
    const ia = FACES[i], ib = FACES[i + 1], ic = FACES[i + 2];
    const a = points[ia], b = points[ib], c = points[ic];
    let nx = 0, ny = 0, nz = 0;
    for (const v of [ia, ib, ic]) {
      nx += normals[v * 3]; ny += normals[v * 3 + 1]; nz += normals[v * 3 + 2];
    }
    const len = Math.hypot(nx, ny, nz) || 1;
    const towards = nz > 0 ? 1 : -1;
    const lambert = Math.max(0,
      towards * (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / len);
    tris.push({ a, b, c, depth: (a[2] + b[2] + c[2]) / 3,
                lit: 0.34 + 0.66 * lambert });
  }
  const ball = project(f.ball[0], f.ball[1], f.ball[2]);
  tris.sort((p, q) => p.depth - q.depth);

  const paintBall = () => {
    g.globalAlpha = f.holding ? 1 : 0.6;
    g.fillStyle = ballColour;
    g.beginPath();
    g.arc(ball[0], ball[1], DATA.ballRadiusCm * k, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = 1;
  };

  let drawnBall = false;
  for (const t of tris) {
    if (!drawnBall && t.depth > ball[2]) { paintBall(); drawnBall = true; }
    const c = `rgb(${Math.round(r * t.lit)},${Math.round(gg * t.lit)},`
      + `${Math.round(bb * t.lit)})`;
    g.fillStyle = c;
    // A hairline of the fill colour closes the seam between neighbours. Canvas
    // antialiases every edge, and 12000 antialiased seams read as a net.
    g.strokeStyle = edges ? 'rgba(0,0,0,0.45)' : c;
    g.lineWidth = edges ? 0.5 : 1;
    g.beginPath();
    g.moveTo(t.a[0], t.a[1]); g.lineTo(t.b[0], t.b[1]); g.lineTo(t.c[0], t.c[1]);
    g.closePath(); g.fill(); g.stroke();
  }
  if (!drawnBall) paintBall();

  document.getElementById('readout').textContent =
    `${f.name} · frame ${f.n === undefined ? f.frame : f.n} · ${tris.length} of `
    + `${FACES.length / 3} faces drawn · vertices to ${(1 / SCALE).toFixed(2)} cm`
    + ` · fit ${f.fit ? f.fit.meanCm + ' cm mean, ' + f.fit.worstCm + ' cm worst'
                     : 'n/a'} · drag to orbit, shift drag to pan, scroll to zoom,`
    + ' double click to reset';
}

document.getElementById('phases').innerHTML = DATA.figures.map((f, i) =>
  `<button type="button" data-phase="${i}" aria-pressed="${i === phase}">${
    f.name.replace(/_/g, ' ')}</button>`).join(' ');
document.getElementById('phases').addEventListener('click', e => {
  const b = e.target.closest('[data-phase]');
  if (!b) return;
  phase = +b.dataset.phase;
  for (const other of document.querySelectorAll('[data-phase]'))
    other.setAttribute('aria-pressed', String(+other.dataset.phase === phase));
  draw();
});

const VIEWS = { front: 0, quarter: 0.55, side: Math.PI / 2, back: Math.PI };
for (const b of document.querySelectorAll('[data-view]'))
  b.addEventListener('click', () => { cam.az = VIEWS[b.dataset.view]; draw(); });

const wire = document.getElementById('wire');
wire.addEventListener('click', () => {
  edges = !edges;
  wire.setAttribute('aria-pressed', String(edges));
  draw();
});

const stage = document.querySelector('.stage');
let drag = null;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey };
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const s = W / stage.getBoundingClientRect().width;
    cam.panX += dx * s; cam.panY += dy * s;
  } else {
    cam.az += dx * 0.009;
    const limit = Math.PI / 2 - 0.02;
    cam.el = Math.max(-limit, Math.min(limit, cam.el + dy * 0.009));
  }
  draw();
});
for (const kind of ['pointerup', 'pointercancel'])
  stage.addEventListener(kind, e => {
    if (drag) { drag = null; stage.releasePointerCapture(e.pointerId); }
  });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = Math.max(0.4, Math.min(6, cam.zoom * Math.exp(-e.deltaY * 0.0016)));
  draw();
}, { passive: false });
stage.addEventListener('dblclick', () => {
  cam = Object.assign({}, HOME);
  draw();
});

draw();
</script>
