[workspace]
authors = ["Marius Bloemhof <developer@pvm.co.za>"]
channels = ["conda-forge"]
name = "spikes"
platforms = ["win-64"]
version = "0.1.0"

# The correct way to run each of these, so it is a file rather than folklore.
#
# The interpreter must be ACTIVATED, not merely located. Invoking
# .pixi/envs/default/python.exe by path runs, passes every pure-Python test,
# and then dies at the first native call with exit 127 and no traceback. An
# independent review lost time to exactly that. `pixi run` activates; a path
# does not.
[tasks]
test = "python -m unittest discover -s . -p \"test_*.py\""
library = "python build_library.py"
limits = "python check_joint_limits.py"
proof = "python proof.py"
seeds = "python measure_seed_variety.py"

[dependencies]
python = "3.12.*"
pymomentum = ">=0.1.114,<0.2"

[pypi-dependencies]
mhr = ">=1.0.1, <2"
mediapipe = ">=1.0.1, <2"
