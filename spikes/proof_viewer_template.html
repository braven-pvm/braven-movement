<title>The Ball Moves Her</title>
<style>
  /* Same instrument palette as the reach report, so the two read as one tool.
     Cool slate ground, the ball the only warm colour, measurements in mono. */
  :root {
    --page: #e9edf1; --card: #ffffff; --ink: #11161c; --soft: #5c6673;
    --line: #c9d2db; --rule: #dde4ea; --ball: #d2701a; --in: #1c6f52;
    --focus: #2c6fb8; --shadow: 0 1px 2px rgba(17, 22, 28, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0e1216; --card: #161b21; --ink: #e4e9ef; --soft: #8d99a7;
      --line: #2a323b; --rule: #222a32; --ball: #e8903f; --in: #4cba8c;
      --focus: #6aa9e8; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --page: #0e1216; --card: #161b21; --ink: #e4e9ef; --soft: #8d99a7;
    --line: #2a323b; --rule: #222a32; --ball: #e8903f; --in: #4cba8c;
    --focus: #6aa9e8; --shadow: none;
  }
  body {
    background: var(--page); color: var(--ink); margin: 0;
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1000px; margin: 0 auto; padding: 40px 20px 64px;
    display: flex; flex-direction: column; gap: 16px;
  }
  header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  h1 { font-size: 27px; line-height: 1.2; margin: 0; letter-spacing: -0.018em;
       text-wrap: balance; }
  .lede { color: var(--soft); margin: 0; max-width: 66ch; }
  .lede b { color: var(--ink); font-weight: 600; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--shadow); padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .label {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.13em;
    color: var(--soft); margin: 0;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
          gap: 14px; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  svg { width: 100%; height: auto; display: block; }
  .stats {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; gap: 1px;
  }
  .stats b { color: var(--ink); font-weight: 500; }
  .controls { display: flex; align-items: center; gap: 14px; }
  button {
    background: var(--ink); color: var(--card); border: 1px solid var(--ink);
    border-radius: 3px; padding: 6px 16px;
    font: 600 13px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
    min-width: 74px;
  }
  input[type=range] { flex: 1; accent-color: var(--ball); min-width: 120px; }
  :is(button, input):focus-visible { outline: 2px solid var(--focus);
                                     outline-offset: 2px; }
  .now {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums;
    min-width: 116px;
  }
  .caught { color: var(--in); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 id="heading"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="panel">
    <div class="grid" id="views"></div>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <input id="scrub" type="range" min="0" value="0" aria-label="Frame">
      <span class="now" id="now">frame 0</span>
    </div>
  </section>
</div>

<script>
const DATA = __DATA__;
const RUNS = DATA.runs;
document.getElementById('heading').textContent = DATA.heading;
document.getElementById('lede').innerHTML = DATA.lede;
const COUNT = Math.max(...RUNS.map(r => r.frames.length));
let at = 0, timer = null;

function bounds() {
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (const run of RUNS) {
    for (const f of run.frames) {
      for (const p of Object.values(f.j).concat([f.b])) {
        for (let i = 0; i < 3; i++) {
          lo[i] = Math.min(lo[i], p[i]); hi[i] = Math.max(hi[i], p[i]);
        }
      }
    }
  }
  // The passer's end of the flight would shrink the athlete to nothing, so the
  // view is framed on her and the ball enters it.
  lo[2] = Math.max(lo[2], -90); hi[2] = Math.min(hi[2], 120);
  return { lo, hi };
}
const B = bounds();
const W = 300, H = 360, PAD = 16;
const spanX = Math.max(B.hi[0] - B.lo[0], 1) * 1.15;
const spanY = Math.max(B.hi[1] - B.lo[1], 1);
const K = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
const midX = (B.lo[0] + B.hi[0]) / 2;
const X = v => W / 2 + (v - midX) * K;
const Y = v => H - PAD - (v - B.lo[1]) * K;

document.getElementById('views').innerHTML = RUNS.map((run, i) => `
  <figure>
    <figcaption class="label">${run.variant} &middot; caught at ${run.catchHeightCm} cm</figcaption>
    <svg id="v${i}" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${run.variant} catch, seen from the front"></svg>
    <div class="stats">
      <span>turn <b>${run.turnedByDegrees.toFixed(0)}&deg;</b> &middot;
            elbow at contact <b>${run.elbowAtContact.toFixed(0)}&deg;</b></span>
      <span>fastest <b>${run.fastestDegreesPerSecond}&deg;/s</b> &middot;
            spike <b>${run.spike.toFixed(2)}</b></span>
    </div>
  </figure>`).join('');

function frameAt(run, i) {
  return run.frames[Math.min(i, run.frames.length - 1)];
}

function draw(run, i, svg) {
  const f = frameAt(run, i);
  const out = [];
  for (const [p, q] of DATA.bones) {
    const a = f.j[p], c = f.j[q];
    if (!a || !c) continue;
    const thin = p.includes('_index') || p.includes('_middle') ||
                 p.includes('_ring') || p.includes('_pinky') ||
                 p.includes('_thumb') || q.match(/(index|middle|ring|pinky|thumb)/);
    out.push(`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}"
      stroke="var(--ink)" stroke-width="${thin ? 1.1 : 2.4}"
      stroke-linecap="round"/>`);
  }
  out.push(`<circle cx="${X(f.b[0])}" cy="${Y(f.b[1])}" r="${DATA.ballRadiusCm * K}"
    fill="var(--ball)" fill-opacity="${f.c ? .95 : .5}"
    stroke="${f.c ? 'var(--in)' : 'var(--soft)'}" stroke-width="${f.c ? 2.2 : 1.2}"/>`);
  svg.innerHTML = out.join('');
}

function show(i) {
  at = i;
  RUNS.forEach((run, n) => draw(run, i, document.getElementById('v' + n)));
  const any = frameAt(RUNS[0], i);
  document.getElementById('now').textContent =
    `frame ${any.n}` + (any.c ? ' · holding' : ' · in flight');
  document.getElementById('now').className = 'now' + (any.c ? ' caught' : '');
  document.getElementById('scrub').value = i;
}

function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById('play').textContent = 'Play';
}
const scrub = document.getElementById('scrub');
scrub.max = COUNT - 1;
scrub.addEventListener('input', e => { stop(); show(+e.target.value); });
document.getElementById('play').addEventListener('click', () => {
  if (timer) { stop(); return; }
  document.getElementById('play').textContent = 'Pause';
  timer = setInterval(() => show((at + 1) % COUNT), 50);
});
show(0);
</script>
